name: Build, Test and Deploy to Azure App Service (Publish Profile)

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: matiaspacheco
  IMAGE_NAME: ics-backend

jobs:
  # ==================================================================
  # NUEVO - JOB 1: Quality Gate (pruebas unitarias, de integración y E2E)
  # ==================================================================
  run-tests:
    name: Quality Gate - Pruebas Unitarias e Integración
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 1. Obtener el código
        uses: actions/checkout@v4

      - name: 2. Configurar SDK de .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 3. Restaurar dependencias
        run: dotnet restore

      - name: 4. Ejecutar la suite de pruebas
        run: dotnet test --no-restore --logger "trx" --logger "console;verbosity=normal" --results-directory ./TestResults

      - name: 5. Guardar los resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults

  # ==================================================================
  # JOB 2: Construcción Docker y despliegue a Azure
  # Los pasos son los del TP3; lo único nuevo es "needs: run-tests".
  # ==================================================================
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: run-tests
    steps:
      - name: 1. Obtener el código
        uses: actions/checkout@v4

      - name: 2. Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 3. Construir la imagen Docker (.NET 8)
        run: |
          docker build \
          -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
          -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest \
          -f Dockerfile .

      - name: 4. Subir la imagen a Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: 5. Desplegar el contenedor en Azure App Service
        if: github.event_name != 'pull_request'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.APP_SERVICE_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
